name: Construire APK Android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Décompresser le projet
        run: |
          mkdir -p project
          unzip -q assistant_ia_1usd_complete.zip -d project

      - name: Trouver le projet Android
        run: |
          ANDROID_DIR=$(dirname "$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)")
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Projet Android : $ANDROID_DIR"

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Préparer Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "build-tools;35.0.0"

      - name: Construire l'application
        run: |
          gradle -p "$ANDROID_DIR" assembleDebug

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Assistant-IA-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
